name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack shop files (first time only)
        run: |
          if [ -f rewear-outlet.zip ]; then
            unzip -oq rewear-outlet.zip && git rm -q rewear-outlet.zip
            git config user.name github-actions && git config user.email actions@github.com
            git add -A && git commit -qm "Add shop files" && git push
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build APK
        run: |
          sed -i "s#__DATA_URL__#https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/data.json#" app/www/index.html
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Rewear outLet Multan" com.rewear.outletmultan --web-dir=www
          npx cap add android
          npx cap sync
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Rewear-Outlet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Rewear Outlet APK ${{ github.run_number }}
          files: Rewear-Outlet.apk
