name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['app/**','package.json','capacitor.config.json','assets/**','.github/workflows/**','*.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project files (zip ya folder, kahin bhi)
        run: |
          if [ ! -f app/www/index.html ]; then
            F=$(find . -path ./.git -prune -o -path '*/app/www/index.html' -print | head -1)
            if [ -z "$F" ]; then
              Z=$(find . -maxdepth 1 -name '*.zip' | head -1)
              [ -z "$Z" ] && { echo "app/www/index.html nahi mila aur koi .zip bhi nahi"; ls -la; exit 1; }
              mkdir /tmp/x && unzip -q "$Z" -d /tmp/x
              F=$(find /tmp/x -path '*/app/www/index.html' | head -1)
              [ -z "$F" ] && { echo "zip ke andar app/www/index.html nahi"; exit 1; }
            fi
            cp -a "$(dirname "$F")/../../." .
          fi
          [ -f package.json ] || { echo "package.json nahi mila: naya rewear-outlet.zip upload karein"; exit 1; }
          ls -la
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Point app to live data
        run: sed -i "s#__DATA_URL__#https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/data/data.json#" app/www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
      - run: npx cap sync android
      - name: Build APK (retry if Maven is busy)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "Retry $i after pause"; sleep 60; done
          exit 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Rewear Outlet APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
