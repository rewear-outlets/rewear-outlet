<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rewear Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#C9A227;--ln:#e6e6e6;--m:#6b6b6b;color-scheme:light}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:14px/1.5 Manrope,system-ui,sans-serif;background:#f6f6f4;color:#111;padding-bottom:80px}
header{background:#000;color:var(--g);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font:700 20px "Bodoni Moda",Georgia,serif}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;z-index:5}
nav button{flex:1;padding:14px 4px;background:none;border:0;border-top:2px solid transparent;color:#bbb;font:600 13px Manrope,sans-serif}nav .on{color:var(--g);border-top-color:var(--g)}
main{max-width:760px;margin:auto;padding:16px}
.c{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.st div{background:#000;color:#fff;border-radius:12px;padding:14px}.st b{display:block;font:700 22px "Bodoni Moda",Georgia,serif;color:var(--g)}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:4px 0 10px;background:#fff;color:#111;font:inherit}
label{font-weight:600;font-size:13px}
.b{padding:10px 14px;border:0;border-radius:10px;background:#000;color:var(--g);font:700 13px Manrope,sans-serif;cursor:pointer}.b.g{background:var(--g);color:#000}.b.d{background:#fff;color:#b00020;border:1px solid #b00020}.b:disabled{opacity:.4}
.pl{display:flex;gap:10px;align-items:center}.pl img{width:56px;height:70px;object-fit:cover;border-radius:8px}.pl div{flex:1;min-width:0}
.th{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.th span{position:relative}.th img{width:70px;height:88px;object-fit:cover;border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,30px);background:#000;color:var(--g);padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:20;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head><body>
<section id="lg" style="max-width:360px;margin:12vh auto;padding:16px"><div class="c">
<h1 style="font:700 24px 'Bodoni Moda',Georgia,serif;margin-bottom:12px">Rewear outLet admin</h1>
<label>GitHub token</label><input id="pw" type="password">
<button class="b g" style="width:100%" onclick="login()">Sign in</button><p id="le" style="color:#b00020;margin-top:8px"></p></div></section>
<div id="ap" hidden>
<header>Rewear admin<button class="b" style="border:1px solid var(--g)" onclick="logout()">Sign out</button></header>
<main>
<div id="t-dash"><div class="st" id="st"></div></div>
<div id="t-prod" hidden><button class="b g" onclick="editP()">Add product</button>
<div class="c" id="pfm" hidden style="margin-top:12px"><input type="hidden" id="pid">
<label>Name</label><input id="pn">
<div class="two"><div><label>Category</label><select id="pc"></select></div><div><label>Condition</label><select id="pd"><option>New</option><option>Like New</option><option>Good</option><option>Fair</option></select></div></div>
<div class="two"><div><label>Price (Rs.)</label><input id="pp" type="number" min="0"></div><div><label>Discount (%)</label><input id="pdc" type="number" min="0" max="90" value="0"></div></div>
<div class="two"><div><label>Stock</label><input id="ps" type="number" min="0"></div><div><label>Sizes, comma separated</label><input id="pz" placeholder="S, M, L, XL"></div></div>
<label>Description</label><textarea id="px" rows="3"></textarea>
<label>Photos (up to 5)</label><input type="file" accept="image/*" multiple onchange="addImgs(this)"><div class="th" id="th"></div>
<button class="b g" id="sv" onclick="saveP()">Save product</button> <button class="b" onclick="$('#pfm').hidden=true">Cancel</button></div>
<div id="pl" style="margin-top:12px"></div></div>
<div id="t-ban" hidden><div class="c"><label>Banner title (optional)</label><input id="bt"><label>Banner image (landscape)</label><input id="bf" type="file" accept="image/*"><button class="b g" onclick="addBan()">Upload banner</button></div><div id="bl"></div></div>
<div id="t-set" hidden><div class="c"><label>Store WhatsApp number (country code, digits only)</label><input id="sw" inputmode="numeric" placeholder="923001234567"><label>Delivery charges (Rs.)</label><input id="sd" type="number" min="0"><label>About shop (app ke niche dikhega)</label><textarea id="sa" rows="3"></textarea><label>CEO</label><input id="sc"><label>Address</label><textarea id="sad" rows="2"></textarea><label>TikTok link</label><input id="stt" placeholder="https://tiktok.com/@yourpage"><label>Facebook link</label><input id="sfb" placeholder="https://facebook.com/yourpage"><label>Instagram link</label><input id="sig" placeholder="https://instagram.com/yourpage"><button class="b g" onclick="saveS()">Save settings</button></div></div>
</main>
<nav><button class="on" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('prod',this)">Products</button><button onclick="tab('ban',this)">Banners</button><button onclick="tab('set',this)">Settings</button></nav>
</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),CATS=["Shirts","T-Shirts","Jeans","Trousers","Shoes","Jackets","Accessories"];
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rs=n=>"Rs. "+Number(n).toLocaleString("en-PK"),src=s=>s;
const OW=location.hostname.split(".")[0],RP=location.pathname.split("/").filter(Boolean)[0]||"",API=`https://api.github.com/repos/${OW}/${RP}/contents/`;
let T="";try{T=localStorage.getItem("rw_tok")||""}catch(_){}let D={settings:{},banners:[],products:[]},imgs=[];$("#pc").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2500)};
const comp=(f,w=700,q=.6)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;{const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height)}r(c.toDataURL("image/jpeg",q))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
const gh=async(p,o={})=>{const r=await fetch(API+p,{...o,cache:"no-store",headers:{Authorization:"Bearer "+T,Accept:"application/vnd.github+json"}});if(!r.ok)throw new Error(r.status);return r.json()};
const dec=f=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\s/g,"")),c=>c.charCodeAt(0))));
const b64=s=>{let r="";new TextEncoder().encode(s).forEach(c=>r+=String.fromCharCode(c));return btoa(r)};
const put=(p,c,sha)=>gh(p,{method:"PUT",body:JSON.stringify({message:"admin update",content:c,sha})});
async function up(d){const n="img/"+Date.now()+Math.random().toString(36).slice(2,6)+".jpg";await put(n,d.split(",")[1]);return n}
async function mut(fn){for(let k=0;;k++){try{const f=await gh("data.json");D=dec(f);fn(D);await put("data.json",b64(JSON.stringify(D)),f.sha);return drawAll()}catch(x){if(k>=2)throw x}}}
function tab(n,b){["dash","prod","ban","set"].forEach(x=>$("#t-"+x).hidden=x!=n);document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b))}
function enter(){$("#lg").hidden=true;$("#ap").hidden=false;drawAll();$("#sw").value=D.settings.whatsapp||"";$("#sd").value=D.settings.delivery??"";const t=D.settings;$("#sa").value=t.about||"";$("#sc").value=t.ceo||"";$("#sad").value=t.address||"";$("#stt").value=t.tiktok||"";$("#sfb").value=t.facebook||"";$("#sig").value=t.instagram||""}
async function login(){T=$("#pw").value.trim();$("#le").textContent="";try{D=dec(await gh("data.json"));try{localStorage.setItem("rw_tok",T)}catch(_){}enter()}catch(_){T="";$("#le").textContent="Token galat hai, ya is repository ka access nahi."}}
function logout(){localStorage.removeItem("rw_tok");location.reload()}
(async()=>{if(!T)return;try{D=dec(await gh("data.json"));enter()}catch(_){T=""}})();
const drawAll=()=>{drawP();drawStats();drawB()};
function drawStats(){const P=D.products;$("#st").innerHTML=[[P.length,"Products"],[P.reduce((a,p)=>a+p.stock,0),"Total stock"],[P.filter(p=>p.stock<=3).length,"Low or out of stock"],[D.banners.length,"Banners"]].map(([v,l])=>`<div><b>${v}</b>${l}</div>`).join("")}
function drawP(){$("#pl").innerHTML=D.products.map(p=>`<div class="c pl"><img src="${src(p.images?.[0]||"")}" alt=""><div><b>${e(p.name)}</b><div style="color:var(--m)">${e(p.category)}, ${rs(Math.round(p.price*(1-(p.discount||0)/100)))}, stock ${p.stock}</div></div><button class="b" onclick="sold('${p.id}')">Sold 1</button><button class="b" onclick="editP('${p.id}')">Edit</button><button class="b d" onclick="delP('${p.id}')">Delete</button></div>`).join("")||"<p>No products yet. Tap Add product to list your first item.</p>"}
const run=async(f,ok)=>{try{toast("Saving...");await f();toast(ok)}catch(x){toast("Save nahi hua ("+(x.message||"?")+"). Internet ya token check karein.")}};
const sold=id=>run(()=>mut(d=>{const p=d.products.find(x=>x.id==id);if(p)p.stock=Math.max(0,p.stock-1)}),"Stock updated");
function showTh(){$("#th").innerHTML=imgs.map((s,i)=>`<span><img src="${src(s)}" alt=""><button class="b d" style="position:absolute;top:-6px;right:-6px;padding:0 7px" onclick="imgs.splice(${i},1);showTh()">×</button></span>`).join("")}
function editP(id){const p=D.products.find(x=>x.id==id)||{};$("#pid").value=id||"";$("#pn").value=p.name||"";$("#pc").value=p.category||CATS[0];$("#pd").value=p.condition||"New";$("#pp").value=p.price??"";$("#pdc").value=p.discount||0;$("#ps").value=p.stock??"";$("#pz").value=(p.sizes||[]).join(", ");$("#px").value=p.description||"";imgs=[...(p.images||[])];showTh();$("#pfm").hidden=false;$("#pfm").scrollIntoView()}
async function addImgs(inp){for(const f of inp.files){if(imgs.length>=5)break;{const d=await comp(f);if(d)imgs.push(d);else toast("Photo read nahi hui")}}inp.value="";showTh()}
async function saveP(){const d={name:$("#pn").value.trim(),category:$("#pc").value,condition:$("#pd").value,price:+$("#pp").value,discount:Math.min(90,Math.max(0,+$("#pdc").value||0)),stock:parseInt($("#ps").value),sizes:$("#pz").value.split(",").map(s=>s.trim()).filter(Boolean),description:$("#px").value.trim()};
if(!d.name||!(d.price>0)||!(d.stock>=0)||!imgs.length)return toast("Add a name, price, stock and at least one photo");
$("#sv").disabled=true;await run(async()=>{d.images=[];for(const s of imgs)d.images.push(s.startsWith("data:")?await up(s):s);const id=$("#pid").value;await mut(x=>{if(id)Object.assign(x.products.find(p=>p.id==id),d);else x.products.unshift({id:"p"+Date.now(),createdAt:Date.now(),...d})});$("#pfm").hidden=true},"Product saved. 1-2 minute mein app mein dikhega");$("#sv").disabled=false}
async function rmImg(n){try{const f=await gh(n);await gh(n,{method:"DELETE",body:JSON.stringify({message:"remove image",sha:f.sha})})}catch(_){}}
const delP=id=>confirm("Delete this product?")&&run(async()=>{const old=D.products.find(p=>p.id==id);await mut(d=>{d.products=d.products.filter(p=>p.id!=id)});for(const n of old?.images||[])if(!n.startsWith("data:"))await rmImg(n)},"Deleted");
function drawB(){$("#bl").innerHTML=D.banners.map(b=>`<div class="c pl"><img style="width:110px;height:56px" src="${src(b.image)}" alt=""><div>${e(b.title)||"Untitled"}</div><button class="b d" onclick="delB('${b.id}')">Delete</button></div>`).join("")||"<p>No banners yet. Upload one to show it on the app home screen.</p>"}
async function addBan(){const f=$("#bf").files[0];if(!f)return toast("Choose an image first");await run(async()=>{const image=await up(await comp(f,1200,.65)),title=$("#bt").value.trim();await mut(d=>d.banners.unshift({id:"b"+Date.now(),title,image}));$("#bt").value="";$("#bf").value=""},"Banner uploaded")}
const delB=id=>confirm("Delete this banner?")&&run(async()=>{const old=D.banners.find(b=>b.id==id);await mut(d=>{d.banners=d.banners.filter(b=>b.id!=id)});if(old&&!old.image.startsWith("data:"))await rmImg(old.image)},"Deleted");
function saveS(){const w=$("#sw").value.replace(/\D/g,"");if(w&&w.length<10)return toast("WhatsApp number country code ke saath likhein");const u=x=>{x=$(x).value.trim();return x&&!/^https?:/i.test(x)?"https://"+x:x};
run(()=>mut(d=>{d.settings={whatsapp:w,delivery:Math.max(0,+$("#sd").value||0),about:$("#sa").value.trim(),ceo:$("#sc").value.trim(),address:$("#sad").value.trim(),tiktok:u("#stt"),facebook:u("#sfb"),instagram:u("#sig")}}),"Settings saved")}
</script></body></html>
